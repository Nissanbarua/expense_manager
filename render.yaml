services:
  - type: web
    name: expense-manager
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromValue: ${MONGODB_URI}
      - key: JWT_SECRET
        fromValue: ${JWT_SECRET}
      - key: ADMIN_EMAIL
        value: admin@expensemanager.com
      - key: ADMIN_PASSWORD
        fromValue: ${ADMIN_PASSWORD}
